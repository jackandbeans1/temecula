<!doctype html><html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>TEMECULA · MEGA STACK v5.4</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<script src="err.js"></script>
<style>
:root{--bg:#0a0a0f;--pnl:#13131b;--pnl2:#1b1b26;--acc:#ff2d78;--acc2:#00e5ff;--txt:#e9e9f2;--dim:#787890;--bord:#252538}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--txt);font:14px/1.5 "Segoe UI",system-ui,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;overscroll-behavior:none}
header{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--pnl);border-bottom:1px solid var(--bord);flex-shrink:0}
.logo{font-weight:800;letter-spacing:1.4px;font-size:13px;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.meta{font-size:11px;color:var(--dim);display:flex;gap:8px}
.spacer{flex:1}
button{background:var(--pnl2);color:var(--txt);border:1px solid var(--bord);border-radius:8px;padding:6px 11px;cursor:pointer;font:inherit;font-size:12.5px;touch-action:manipulation}
button:hover{border-color:var(--acc);color:#fff}
button.pri{background:linear-gradient(90deg,var(--acc),#ff5c9a);border:none;font-weight:700}
button.on{border-color:var(--acc2);color:var(--acc2)}
#wrap{flex:1;display:flex;overflow:hidden}
#grid{flex:1;overflow-y:auto;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:11px;align-content:start;-webkit-overflow-scrolling:touch}
.card{background:var(--pnl);border:1px solid var(--bord);border-radius:13px;padding:13px;cursor:pointer;transition:.15s}
.card:hover{border-color:var(--acc);transform:translateY(-3px)}
.av{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;margin-bottom:8px;color:#0a0a0f}
.nm{font-weight:700;font-size:14.5px}
.age{color:var(--acc2);font-size:11px;font-weight:600}
.tg{color:var(--dim);font-size:10.5px;margin-top:4px;font-style:italic}
#chat{width:0;display:flex;flex-direction:column;background:var(--pnl);border-left:1px solid var(--bord);transition:width .18s;overflow:hidden}
#chat.on{width:56%}
#chd{padding:10px 13px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:9px;flex-shrink:0}
#tabs{display:flex;gap:5px;margin-left:auto}
#msgs,#gal{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
#msgs{display:flex;flex-direction:column;gap:9px}
#gal{display:none;flex-wrap:wrap;gap:8px;align-content:flex-start}
#gal img{width:calc(50% - 4px);border-radius:9px;cursor:pointer}
.m{max-width:84%;padding:8px 12px;border-radius:13px;white-space:pre-wrap;word-wrap:break-word;font-size:13.5px}
.m.u{align-self:flex-end;background:linear-gradient(90deg,#2a1a3a,#3a1a2a);border:1px solid #4a2a4a}
.m.a{align-self:flex-start;background:var(--pnl2);border:1px solid var(--bord)}
.m.sys{align-self:center;color:var(--dim);font-size:11px;font-style:italic;background:none;border:none;max-width:95%}
.m img{max-width:100%;border-radius:9px;margin-top:5px;display:block}
.m .who{font-size:10.5px;color:var(--acc2);font-weight:700;margin-bottom:3px}
#bar{padding:9px;border-top:1px solid var(--bord);display:flex;gap:7px;flex-shrink:0}
#in{flex:1;background:var(--pnl2);border:1px solid var(--bord);border-radius:9px;color:var(--txt);padding:9px;resize:none;font:inherit;height:42px}
#in:focus{outline:none;border-color:var(--acc)}
#set{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:50}
#set.on{display:flex}
#setbox{background:var(--pnl);border:1px solid var(--bord);border-radius:15px;padding:20px;width:500px;max-width:94vw;max-height:92vh;overflow-y:auto}
#setbox h3{margin-bottom:4px}
#setbox label{display:block;color:var(--dim);font-size:11px;margin:11px 0 4px}
#setbox input,#setbox select{width:100%;background:var(--pnl2);border:1px solid var(--bord);border-radius:8px;color:var(--txt);padding:8px;font:inherit;font-size:12.5px}
.row{display:flex;gap:7px;margin-top:16px}
.note{color:var(--dim);font-size:10.5px;margin-top:10px;line-height:1.5}
h4{margin:16px 0 2px;font-size:12.5px;color:var(--acc2)}

@media (max-width:760px){
  header{padding:8px 10px;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  header::-webkit-scrollbar{display:none}
  .meta{display:none}
  .logo{font-size:11.5px;letter-spacing:.9px;white-space:nowrap}
  button{padding:8px 10px;font-size:13px;min-height:40px}
  #grid{grid-template-columns:repeat(2,1fr);gap:9px;padding:10px}
  .card{padding:10px;border-radius:11px}
  .card:hover{transform:none}
  .av{width:40px;height:40px;font-size:16px}
  #chat{position:fixed;inset:0;width:100%!important;height:100dvh;z-index:40;border-left:none;
        transform:translateY(100%);transition:transform .22s ease}
  #chat.on{transform:translateY(0)}
  #chd{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top))}
  #tabs{gap:4px}
  #tabs button{padding:8px 9px;min-width:40px}
  .m{max-width:88%;font-size:15px}
  #bar{padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
  #in{font-size:16px;height:44px}
  #setbox{width:100%;max-width:100%;height:100dvh;max-height:100dvh;border-radius:0;padding:16px;
          padding-top:calc(16px + env(safe-area-inset-top))}
  #setbox input,#setbox select{font-size:16px;padding:10px}
  #imgdlg>div{width:100%!important;max-width:100%!important;height:100dvh;max-height:100dvh;
              border-radius:0!important;padding:16px!important;
              padding-top:calc(16px + env(safe-area-inset-top))!important}
  #imgdlg>div>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}
  #iPrompt{height:100px}
}
@media (prefers-reduced-motion:reduce){#chat{transition:none}}
</style></head><body>
<header>
  <div class="logo">TEMECULA · MEGA STACK v5.4</div>
  <div class="meta"><span id="cnt"></span><span>·</span><span id="prov">venice</span></div>
  <div class="spacer"></div>
  <button id="grp" onclick="toggleGroup()">Group</button>
  <button onclick="exportAll()">Export</button>
  <button onclick="importAll()">Import</button>
  <button onclick="openSet()">Settings</button>
</header>
<div id="wrap">
  <div id="grid"></div>
  <div id="chat">
    <div id="chd">
      <div id="chav" class="av" style="width:36px;height:36px;font-size:14px"></div>
      <div><div id="chnm" style="font-weight:700;font-size:14px"></div><div id="chsub" style="font-size:10.5px;color:var(--dim)"></div></div>
      <div id="tabs">
        <button id="tbC" class="on" onclick="tab('chat')">Chat</button>
        <button id="tbG" onclick="tab('gal')">Gallery</button>
        <button onclick="genImg()" title="generate">📷</button>
        <button id="relbtn" onclick="setRel()" title="relationship">👤</button>
        <button id="tts" onclick="toggleTTS()" title="voice">🔊</button>
        <button onclick="resetChat()">↺</button>
        <button onclick="closeChat()">✕</button>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="gal"></div>
    <div id="bar"><textarea id="in" placeholder="type… (Enter sends, Shift+Enter newline)"></textarea><button class="pri" onclick="send()">Send</button><button onclick="stopGen()">■</button></div>
  </div>
</div>
<div id="set"><div id="setbox">
  <h3>Settings</h3>
  <div class="note">Direct mode: set bases to <b>https://api.venice.ai/api/v1</b> and paste your key. Local proxy optional.</div>

  <h4>Chat</h4>
  <label>Chat provider</label><select id="sCP"></select>
  <label>Chat base</label><input id="sCB" placeholder="https://api.venice.ai/api/v1">
  <label>Chat key</label><input id="sCK" type="password">
  <label>Chat model</label><input id="sCM" placeholder="venice-uncensored-1-2">
  <label>Fallback order (comma-sep provider ids)</label><input id="sFB" placeholder="venice,openrouter,ollama">
  <label>OpenRouter key (fallback)</label><input id="sKO" type="password">
  <label>Groq key (fallback)</label><input id="sKG" type="password">
  <label>Together key (fallback)</label><input id="sKT" type="password">

  <h4>Image</h4>
  <label>Image provider</label><select id="sIP"></select>
  <label>Image base</label><input id="sIB" placeholder="https://api.venice.ai/api/v1">
  <label>Image key</label><input id="sIK" type="password">
  <label>Image model</label><input id="sIM" placeholder="wai-Illustrious">
  <label>Width</label><input id="sIW" type="number" step="16" placeholder="832">
  <label>Height</label><input id="sIH" type="number" step="16" placeholder="1216">
  <label>Steps</label><input id="sSteps" type="number" min="1" max="50" placeholder="25">
  <label>CFG</label><input id="sCfg" type="number" step="0.5" min="1" max="20" placeholder="6.5">

  <h4>You</h4>
  <label>Your name</label><input id="sName" placeholder="operator">
  <label>Temperature</label><input id="sTemp" type="number" step="0.05" min="0" max="2">

  <div class="row"><button class="pri" onclick="saveSet()">Save</button><button onclick="closeSet()">Cancel</button><button onclick="nuke()" style="margin-left:auto">Nuke</button></div>
</div></div>
<script src="imgstore.js"></script>
<script src="data.js"></script>
<script src="providers.js"></script>
<script src="app.js"></script>
</body></html>
