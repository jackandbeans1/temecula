<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>temecula</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d10">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>temecula</h1>
  <div class="hdr-actions">
    <button id="group-btn" type="button">group</button>
    <button id="settings-btn" type="button" aria-label="settings">⚙</button>
  </div>
</header>

<main id="grid"></main>

<section id="chat" aria-live="polite">
  <div id="chat-head">
    <button id="back" type="button" aria-label="back">←</button>
    <span id="chat-title"></span>
  </div>
  <div id="chat-body"></div>
  <div id="composer">
    <textarea id="input" rows="1" placeholder="message" autocomplete="off"></textarea>
    <button id="send" type="button" aria-label="send">↑</button>
  </div>
</section>

<dialog id="settings">
  <div class="dlg-head">
    <h2>settings</h2>
    <button id="settings-close" type="button" aria-label="close">✕</button>
  </div>
  <p class="hint">proxy: <span id="proxy-state"></span></p>
  <fieldset id="providers"><legend>provider</legend></fieldset>
  <fieldset id="keys"><legend>keys</legend></fieldset>
</dialog>

<script type="module" src="app.js"></script>
</body>
</html>
